name: terraform-ci

on:
  push:
    branches:
      - master
      - main
  pull_request:

permissions:
  contents: read

env:
  TERRAFORM_VERSION: "1.9.8"

jobs:
  terraform:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Terraform
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSLo /tmp/terraform.zip "https://releases.hashicorp.com/terraform/${TERRAFORM_VERSION}/terraform_${TERRAFORM_VERSION}_linux_amd64.zip"
          unzip -q /tmp/terraform.zip -d /tmp
          sudo mv /tmp/terraform /usr/local/bin/terraform
          terraform version

      - name: Check formatting
        run: terraform fmt -check -recursive

      - name: Validate root stack
        run: |
          terraform init -backend=false -input=false -no-color
          terraform validate -no-color

      - name: Validate example manifests are present
        shell: bash
        run: |
          set -euo pipefail
          for file in \
            examples/atlantis.yaml \
            examples/atlantis.monorepo.yaml \
            examples/atlantis.multi-stack.yaml; do
            test -s "${file}"
          done
